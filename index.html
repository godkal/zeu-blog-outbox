<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>오늘의 블로그 글 · 법률사무소 제우</title>
<style>
:root{--ink:#1f2226;--text:#2a2d32;--muted:#6d7177;--line:#e4e2dd;--paper:#fff;--warm:#f6f5f2;--accent:#a08d6a;--ok:#2f6b4f;--ok-bg:#eaf3ee;--stop:#8a3b2e;--stop-bg:#f8ebe7;--warn-bg:#fbf4e4;
--sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--warm);color:var(--text);font:16px/1.7 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-size:14px;letter-spacing:.02em;color:var(--muted)}
.brand b{color:var(--ink);font-weight:700}
.updated{font-size:13px;color:var(--muted)}
h1{font-size:26px;line-height:1.35;color:var(--ink);margin:0 0 4px}
h2{font-size:18px;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h2 .n{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font-size:13px;margin-right:8px}
section{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;margin:0 0 16px}
.status{border-width:2px;padding:20px 20px 18px}
.status p{margin:6px 0 0}
.status .big{font-size:22px;font-weight:800;margin:0}
.status.post{border-color:var(--ok);background:var(--ok-bg)} .status.post .big{color:var(--ok)}
.status.done,.status.hold{border-color:var(--stop);background:var(--stop-bg)} .status.done .big,.status.hold .big{color:var(--stop)}
.alert{background:var(--warn-bg);border:1px solid #e6d3a8;border-radius:6px;padding:14px 16px;margin:0 0 16px;font-size:15px}
.alert b{color:#7a5b16}
ol.steps{margin:0;padding-left:22px} ol.steps li{margin:6px 0}
.box{background:var(--warm);border:1px solid var(--line);border-radius:4px;padding:14px 16px;font-size:17px;color:var(--ink);white-space:pre-wrap}
.box.title{font-weight:700;font-size:19px}
.box.tags{white-space:normal;line-height:1.9}
.box.tags .tag{white-space:nowrap}
.copy{flex:none;font:600 14px var(--sans);color:#fff;background:var(--ink);border:0;border-radius:4px;padding:8px 14px;min-height:36px;cursor:pointer}
.copy:active{transform:translateY(1px)} .copy.ok{background:var(--ok)}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.mark{color:var(--accent);font-weight:700}
.post-body{border:1px solid var(--line);border-radius:4px;padding:16px 18px;background:#fff;color:#222}
.post-body p{margin:0 0 12px}
.post-body h3{font-size:18px;margin:22px 0 10px;color:var(--ink)}
.post-body blockquote{margin:0 0 14px;padding:12px 16px;border-left:4px solid var(--accent);background:var(--warm)}
.post-body blockquote p{margin:0}
.post-body table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:15px}
.post-body th,.post-body td{border:1px solid #cfccc5;padding:8px 10px;text-align:left;vertical-align:top}
.post-body th{background:var(--warm)}
.post-body a{color:#2a5db0}
.photos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photos li{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--warm)}
.photos img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;background:#eee}
.photos a.dl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;color:var(--ink);text-decoration:none;font-weight:600}
.photos a.dl span{color:var(--muted);font-weight:400}
pre.plain{margin:0;white-space:pre-wrap;font:15px/1.7 var(--sans);background:var(--warm);border:1px solid var(--line);border-radius:4px;padding:14px 16px;max-height:420px;overflow:auto}
details summary{cursor:pointer;font-weight:700;color:var(--ink)}
details[open] summary{margin-bottom:12px}
table.hist{width:100%;border-collapse:collapse;font-size:15px}
table.hist td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
table.hist td.d{white-space:nowrap;color:var(--muted);width:70px}
table.hist a{color:var(--ink)}
.empty{color:var(--muted);margin:0}
main a{color:#2a5db0;text-underline-offset:3px}
footer{font-size:13px;color:var(--muted);text-align:center;margin-top:28px}
@media (max-width:480px){h1{font-size:22px}section{padding:16px}.status .big{font-size:20px}h2{font-size:17px}}
</style>
</head>
<body>
<main>
<header class="top"><div class="brand"><b>법률사무소 제우</b> · 네이버 블로그 원고함</div><div class="updated">업데이트 11월 21일 18:00</div></header>
<h1>2026년 11월 21일 (토) 오늘의 글</h1>
<p class="note" style="margin:0 0 16px">이 날짜가 오늘이 아니면 아직 새로 준비되지 않은 것이니 올리지 마세요.</p>
<section class="status hold" id="status"><p class="big">⛔ 오늘은 올리지 마세요</p><p>예약 도우미로 올리는 중이에요. 이 원고함에서는 올리지 마세요.</p></section>


<section id="history"><h2>최근 블로그 게시</h2><p class="empty">아직 확인된 게시 글이 없어요.</p></section>
<footer>이 페이지는 매일 06:00 · 09:30 · 11:00(한국 시간)에 자동으로 바뀝니다 · 기계용: <a href="today.json">today.json</a> · <a href="today.txt">today.txt</a></footer>
</main>
<script>
document.addEventListener("click",function(e){var b=e.target.closest("[data-copy]");if(!b)return;
var el=document.getElementById(b.getAttribute("data-copy"));if(!el)return;var rich=b.hasAttribute("data-rich");
var html=el.innerHTML,text=el.innerText;var ok=function(){var t=b.textContent;b.textContent="복사됨";b.classList.add("ok");setTimeout(function(){b.textContent=t;b.classList.remove("ok")},1500)};
var fallback=function(){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand("copy");ok()}catch(_){}};
try{if(rich&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([text],{type:"text/plain"})})]).then(ok,fallback)}
else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback)}else fallback()}catch(_){fallback()}});
</script>
</body>
</html>
